name: Build & Release

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cli_name: bright-sdk-downloader-linux-x64
            lib_name: libbright_sdk_download.so
          - target: x86_64-apple-darwin
            os: macos-latest
            cli_name: bright-sdk-downloader-macos-x64
            lib_name: libbright_sdk_download.dylib
          - target: aarch64-apple-darwin
            os: macos-latest
            cli_name: bright-sdk-downloader-macos-arm64
            lib_name: libbright_sdk_download.dylib
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            cli_name: bright-sdk-downloader-win-x64.exe
            lib_name: bright_sdk_download.dll

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install mingw-w64 (Windows cross-compile)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "$src/bright-sdk-downloader.exe" "dist/${{ matrix.cli_name }}"
          else
            cp "$src/bright-sdk-downloader" "dist/${{ matrix.cli_name }}"
          fi
          cp "$src/${{ matrix.lib_name }}" "dist/${{ matrix.lib_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cli_name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
